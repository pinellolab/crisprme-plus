# Named window configurations for `crisprme.py extract-flanks` (--preset <name>).
#
# This file is the extension point: an assay with its own geometry belongs HERE, as a
# section, not in the code. `extract-flanks --help` lists whatever this file holds,
# beside the two shipped presets (`oligo`, the default 3/6 geometry, and `amplicon`,
# 200 either side), and a section with the same name as a shipped one replaces it.
#
# Read, in order, each overriding the one before it by name:
#   1. the presets built into PostProcess/extract_flanks.py
#   2. this file
#   3. every file named by $CRISPRME_FLANK_PRESETS (os.pathsep-separated)
#   4. every --preset-file given on the command line
#
# A flag on the command line always wins over the preset -- including over the preset's
# OTHER form of the window, because the two forms are one window: a preset's window = 200
# is 200 beyond each end, so `--preset <name> --window 50` is 50 at both ends and
# `--preset <name> --upstream 5` replaces that one end and leaves the other as the preset
# set it. A section of this file can therefore be combined with any flag.
#
# The keys of a section (any subset; an unknown key is an error, not a shrug):
#
#   upstream        bases beyond the PROTOSPACER's outer end
#   downstream      bases beyond the PAM's outer end
#   window          the symmetric form: the same as upstream = W and downstream = W
#                   (one SECTION must give either window, or upstream/downstream, never
#                   both -- that is one source saying two different things)
#   length_policy   anchored (keep the paddings, let the total vary -- the default) or
#                   fixed-total (hold the reference interval at
#                   upstream + spacer+PAM + downstream and take a bulge's difference
#                   out of the padding)
#   orientation     guide (the protospacer reads 5'->3' as the guide does) or genome
#   max_haplotypes  how many haplotypes to write per row beside the reference
#   filter          a row expression over the table's own columns
#   description     one line, shown by --help
#
# A worked example of a short targeted-sequencing oligo, 3 nt beyond the protospacer
# and 6 nt beyond the PAM -- a 32-mer for a 20-nt spacer with a 3-nt PAM -- restricted
# to the sites whose ALT and REF alignments both score at or above the CRISPR-Bulge
# sensitive operating point. Uncomment, rename for your assay, and change the numbers:
#
# [my-assay]
# upstream = 3
# downstream = 6
# orientation = guide
# length_policy = anchored
# filter = CRISPR_Bulge >= CB_SENSITIVE and CRISPR_Bulge_ref >= CB_SENSITIVE
# description = my 32-mer validation oligo, ALT and REF both above the sensitive cut
#
# A 5'-PAM example (Cas12a): the same two numbers land on the opposite genomic sides,
# which extract-flanks works out from the run's own PAM file -- nothing to set here.
#
# [cas12a-oligo]
# upstream = 4
# downstream = 8
# description = a Cas12a oligo: 4 nt beyond the protospacer, 8 nt beyond the TTTV
