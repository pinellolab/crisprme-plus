# CRISPRme+ 2.4.0 runtime environment (Python 3.11), for installing FROM SOURCE
# without the Bioconda crisprme/crispritz packages. Mirrors the dependency set
# validated in the project Dockerfile.
#
#   mamba env create -f environment.yml
#   mamba activate crisprme
#   bash install_from_source.sh          # builds crispritz 2.8.2 + installs both
#
# NOTE: the scikit-learn/numpy/scipy/pandas pins below existed ONLY because the vendored
# CRISTA + azimuth pickles required that exact combination. CRISTA has been RETIRED
# (CRISPR-Bulge replaces it, in its own conda env) and azimuth is gone, so these pins are
# no longer required by any scorer -- CFD uses tiny version-agnostic lookup pickles. They
# are kept here conservatively; MODERNIZING them (current sklearn/numpy) is done + validated
# against the full test suite in a dedicated pass (numpy 2.x has breaking changes).
name: crisprme
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # --- scoring stack (legacy pin, no longer scorer-required; see note above)
  - scikit-learn=1.1.3
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.0.3
  - matplotlib-base<3.9        # >=3.9 needs numpy>=1.25, conflicts with the numpy pin
  # --- pipeline / analysis
  - biopython
  - more-itertools
  - statsmodels
  - intervaltree
  - ijson                      # streaming low-RAM SNP-dict reader in new_simple_analysis.py (else falls back to whole-file json.load); matches the Docker image
  - pysam
  - bcftools
  - bedtools
  - bedops
  - samtools
  - htslib
  - ucsc-liftover              # assembly-search liftOver dependency
  - axel
  - gdown
  - zip
  - unzip
  - gsl
  - importlib-metadata
  - huggingface_hub            # crisprme.py download / publish-index
  # --- Dash 2.x web stack
  - dash>=2.14,<3
  - dash-bootstrap-components<2   # >=2.0.0 requires React 18 (Dash>=3); this app's
                                   # dash-renderer is still React 16 -- dbc>=2.0.0
                                   # silently renders some components (e.g. dbc.Tabs,
                                   # via an internal useId() call) with null ids and
                                   # empty content under React 16, no console error.
                                   # Pin to the last React-16-compatible 1.x release.
  - dash-daq
  - flask
  - flask-caching
  - flask-compress
  - gunicorn
  - werkzeug
  # --- build toolchain to compile the CRISPRitz C++ binaries (OpenMP-enabled)
  - cxx-compiler
  - make
  - git
  - zlib               # enricher.cpp #includes <zlib.h>; not on cxx-compiler's own include path
  # --- test suite
  - pytest             # PostProcess/test_*.py unit tests
