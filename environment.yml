# CRISPRme+ 2.6.0 runtime environment (Python 3.11), for installing FROM SOURCE
# without the Bioconda crisprme/crispritz packages. Mirrors the dependency set
# validated in the project Dockerfile.
#
#   mamba env create -f environment.yml
#   mamba activate crisprme
#   bash install_from_source.sh          # builds crispritz 2.8.3 + installs both
#
# NOTE: the scikit-learn/numpy/scipy/pandas versions were once hard-pinned to
# scikit-learn=1.1.3 / numpy=1.24.4 / scipy=1.10.1 / pandas=2.0.3 ONLY because the
# legacy RandomForest scorer + azimuth pickles required that exact
# combination; that scorer is RETIRED (CRISPR-Bulge replaces it, in its own cbulge
# env, and imposes none of these main-env pins) and azimuth is gone, so:
#   * scikit-learn is REMOVED -- nothing in the main env imports it anymore (the only
#     remaining use is the dev-only bench_cbulge.py, which runs in the cbulge env).
#   * numpy / scipy / pandas / matplotlib are MODERNIZED (2-year jump, current maintained
#     lines). CFD uses tiny version-agnostic lookup pickles, so the scoring is unaffected.
# numpy is capped < 2 as a deliberate guard: the pysam / CRISPRitz C-extensions in this
# env are built against the numpy 1.x C-ABI, and a numpy-2 ABI mismatch could silently
# corrupt results in a clinical tool. numpy 2.x is a validated fast-follow, not this pass.
name: crisprme
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # --- numerical stack (modernized; the legacy scorer's hard pins retired -- see note above)
  - numpy>=1.26,<2      # was 1.24.4 (legacy-scorer pin); <2 guards the pysam/CRISPRitz C-ABI
  - scipy>=1.11         # was 1.10.1; used by the radar-chart distance calc
  - pandas>=2.1,<3      # was 2.0.3; <3 caps out pandas 3.0's copy-on-write semantic
                        # change until the real pipeline (heavy in-place DataFrame
                        # mutation) is e2e-validated on it -- 3.0 is a fast-follow.
                        # NB: the full 724-test unit suite already passes on pandas 3.0.6.
  - matplotlib-base>=3.8   # ceiling dropped (was <3.9); numpy>=1.26 satisfies mpl>=3.9
  # --- pipeline / analysis
  - biopython
  - more-itertools
  - statsmodels
  - intervaltree
  - ijson                      # streaming low-RAM SNP-dict reader in new_simple_analysis.py (else falls back to whole-file json.load); matches the Docker image
  - pysam
  - bcftools
  - bedtools
  - bedops
  - samtools
  - htslib
  - ucsc-liftover              # assembly-search liftOver dependency
  - minimap2                   # assembly-search direct haplotype-vs-haplotype alignment
  - impg=0.5.0                 # assembly-search direct haplotype-vs-haplotype coordinate lookup (pinned: query_haplotype_alignment parses 0.5.x-specific bedpe/CLI behavior)
  - axel
  - gdown
  - zip
  - unzip
  - gsl
  - importlib-metadata
  - huggingface_hub            # crisprme.py download / publish-index
  # --- Dash 2.x web stack
  - dash>=2.14,<3
  - dash-bootstrap-components<2   # >=2.0.0 requires React 18 (Dash>=3); this app's
                                   # dash-renderer is still React 16 -- dbc>=2.0.0
                                   # silently renders some components (e.g. dbc.Tabs,
                                   # via an internal useId() call) with null ids and
                                   # empty content under React 16, no console error.
                                   # Pin to the last React-16-compatible 1.x release.
  - dash-daq
  - flask
  - flask-caching
  - flask-compress
  - gunicorn
  - werkzeug
  # --- build toolchain to compile the CRISPRitz C++ binaries (OpenMP-enabled)
  - cxx-compiler
  - make
  - git
  - zlib               # enricher.cpp #includes <zlib.h>; not on cxx-compiler's own include path
  # --- test suite
  - pytest             # PostProcess/test_*.py unit tests
