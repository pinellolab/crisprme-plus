name: unit tests

# Fast, hermetic Python checks that run on every PR touching the code: byte-
# compile the whole pipeline (syntax) and run the network-free unit tests for
# the HuggingFace download/publish + reference-index layer. No Docker build and
# no genome download, so this gives quick signal independent of the heavier
# validate-benchmarks (chr22) and Docker workflows.
#
# Only `requests` is installed (utils.py imports it at module load). We do NOT
# install huggingface_hub: the fallback-contract test then exercises the
# "huggingface_hub absent -> ImportError -> caller falls back" path with no
# network access, keeping CI deterministic.

on:
  pull_request:
    paths:
      - "crisprme.py"
      - "PostProcess/**"
      # Only these pages/ files, not pages/** -- they are the ones this
      # workflow's own tests cover (via AST-extraction, no Dash needed);
      # the rest of pages/ is covered by web-e2e.yml instead.
      - "pages/history_page.py"
      - "pages/settings_page.py"
      # app.py sizes the search pool from app_settings at import time and index.py
      # imports it; test_app_settings guards that, so a PR touching only these two
      # must still run it.
      - "app.py"
      - "index.py"
      - ".github/workflows/unit-tests.yml"
  push:
    branches: [ "main", "python3.11", "2.2.0-dev" ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light deps
        # requests: utils.py imports it at module load. numpy: test_phased_haplotype
        # exercises the real iupac_decomposition, which uses np.array (the only
        # scientific-stack dep on that hot path; pandas/CRISPR-Bulge scoring are stubbed in
        # the test since that path uses neither). pandas: test_reference_row_downstream
        # runs the REAL remove_n_and_dots.py (pandas) to reproduce the NaN round-trip
        # that crashed resultIntegrator. pandas + matplotlib: the shareable-report
        # generator (generate_report.py) uses both, and test_generate_report self-skips
        # without them. Still no huggingface_hub, so the fallback-contract test keeps
        # exercising the absent-hf_hub path offline.
        # pyliftover: the assembly-reconcile lift tests (run_liftover + the
        # constructed-truth lift suite) exercise the real pyliftover path; without it
        # they self-skip, leaving the coordinate-lift behaviour unguarded in CI.
        run: python -m pip install --upgrade pip requests numpy pandas matplotlib pysam pyliftover

      - name: Byte-compile the pipeline (syntax check)
        # pages/history_page.py + pages/settings_page.py: syntax-only (py_compile
        # doesn't execute imports), included here since test_history_page_assembly.py
        # and test_settings_progress.py below exercise them via AST-extraction rather
        # than a normal import (they need a live Dash `app`, which this light CI
        # doesn't set up).
        run: python -m py_compile crisprme.py PostProcess/*.py pages/history_page.py pages/settings_page.py app.py

      - name: HuggingFace download/publish + index unit tests (network-free)
        working-directory: PostProcess
        run: python -m unittest test_crisprme_hf -v

      - name: "Web Settings download progress + failure relay (2.8.1; AST-extracted, no Dash)"
        working-directory: PostProcess
        run: python -m unittest test_settings_progress -v

      - name: HF fallback contract (hf_fetch must raise so callers fall back)
        working-directory: PostProcess
        run: python -m unittest test_hf_downloads.TestHfFetchFallbackContract -v

      - name: Variant-index bundle round-trip (dicts travel with the index)
        working-directory: PostProcess
        run: python -m unittest test_index_bundle -v

      - name: Dictless publish/download tiers (registry + genotype companion)
        working-directory: PostProcess
        run: python -m unittest test_dictless_publish -v

      - name: Dictless download OOTB fixes (canonical install name + combined samplesID)
        working-directory: PostProcess
        run: python -m unittest test_dictless_download -v

      - name: "samplesID self-completeness (build emits combined + publish bundles + download installs)"
        working-directory: PostProcess
        run: python -m unittest test_samplesid_emit -v

      - name: Gzipped variant dicts (publish/download route .gz dicts)
        working-directory: PostProcess
        run: python -m unittest test_dict_gzip -v

      - name: Pre-flight input validator (batteries case + guide/PAM padding)
        working-directory: PostProcess
        run: python -m unittest test_validate_inputs -v

      - name: Genome layout (one FASTA per sequence; multi-sequence genomes split or refused)
        working-directory: PostProcess
        run: python -m unittest test_genome_layout -v

      - name: "samplesID over-listing guard (#46: phantom samples inflate AN / deflate AF)"
        working-directory: PostProcess
        run: python test_samplesid_overlisting.py

      - name: post_process.sh writes temps to output dir, not install dir
        working-directory: PostProcess
        run: python -m unittest test_post_process_tempdir -v

      - name: Tier-0 registry (dictless redesign — aggregator + mmap round-trip)
        working-directory: PostProcess
        run: python -m unittest test_tier0_registry -v

      - name: Tier-0 compile adapter (dict -> registry, full-panel AN)
        working-directory: PostProcess
        run: python -m unittest test_tier0_compile -v

      - name: Tier-0 wiring into new_simple_analysis (legacy path unchanged + selection matrix)
        working-directory: PostProcess
        run: python -m unittest test_new_simple_analysis_registry -v

      - name: Tier-1 genotype store (per-sample carrier reconstruction round-trip)
        working-directory: PostProcess
        run: python -m unittest test_tier1_genotypes -v

      - name: Tier-1 wiring (genotype tier -> Samples; standalone dictless path)
        working-directory: PostProcess
        run: python -m unittest test_tier1_wiring -v

      - name: Population summary (combination-aware per-db/subpop/global AF)
        working-directory: PostProcess
        run: python -m unittest test_population_summary -v

      - name: Population summary companion wiring (additive off-target output)
        working-directory: PostProcess
        run: python -m unittest test_popsummary_wiring -v

      - name: Dictless tier build emission (build emits tiers where search reads them)
        working-directory: PostProcess
        run: python -m unittest test_build_emit_tiers -v

      - name: "Indel per-chrom subset regression (#172: fakechrom match)"
        working-directory: PostProcess
        run: python -m unittest test_indel_chrom_subset -v

      - name: "Indel-path PAM creation (#94: writes PAM_gen index 10, not Var_uniq 11)"
        working-directory: PostProcess
        run: python -m unittest test_indel_pam_creation -v

      - name: "Indel+SNP co-occurrence (overlay, phased indel GT, cis join, brute-force oracle vs real chr22 fixture)"
        # feature/indel-snp: SNP+indel co-occurring off-target discovery. Pure stdlib
        # tests (no extra deps) + a ~16KB real-data fixture whose brute-force ORACLE
        # independently reconstructs+aligns to cross-validate every coordinate hop
        # (overlay, bulge+strand window map, co-occurrence decode, cis join). Each file
        # is a function-based suite with a __main__ runner that raises on failure.
        working-directory: PostProcess
        run: |
          python test_indel_snp_overlay.py
          python test_indel_genotypes.py
          python test_indel_snp_cis.py
          python test_indel_snp_bruteforce.py

      - name: "Dict-less bulge cap + defaults + 0-bulge indel routing (v2.3.3)"
        working-directory: PostProcess
        run: python -m unittest test_bulge_cap -v

      - name: "Population-distribution out-of-range total never crashes (v2.3.3)"
        working-directory: PostProcess
        run: python -m unittest test_populations_distribution -v

      - name: Phased multi-SNP haplotype not under-reported (deferred-peel fix)
        working-directory: PostProcess
        run: python -m unittest test_phased_haplotype -v

      - name: "Observed-haplotype enumerator (per-individual, confirmed/putative)"
        working-directory: PostProcess
        run: python -m unittest test_observed_haplotypes -v

      - name: "Observed-haplotype integration (real iupac_decomposition, sentinel tail intact)"
        working-directory: PostProcess
        run: python -m unittest test_observed_haplotype_integration -v

      - name: "AF panel denominator uses VCF-filtered genotyped samples"
        working-directory: PostProcess
        run: python -m unittest test_af_denominator_panel -v

      - name: "Reference off-target row flows downstream (no resultIntegrator IndexError)"
        working-directory: PostProcess
        run: python -m unittest test_reference_row_downstream -v

      - name: "Deterministic dedup ordering (#46: sample/rsID/AF/annotation lists sorted, not PYTHONHASHSEED-random)"
        working-directory: PostProcess
        run: python test_determinism.py

      - name: "Shareable report (self-contained ZIP: report.html + tsv.gz, base64 plots, top-N table)"
        working-directory: PostProcess
        run: python -m unittest test_generate_report -v

      - name: "Off-target risk card + CSS-only modal (self-contained, no-thead parser-safe, graceful degradation, IND quantities)"
        working-directory: PostProcess
        run: python -m unittest test_risk_card -v

      - name: "Observed-haplotypes sidecar (make_oh_sidecar: alt-origin superset, byte-identical rows, safe degrade)"
        working-directory: PostProcess
        run: python -m unittest test_make_oh_sidecar -v

      - name: "Scorer-aware report column (CRISPR-Bulge|CRISPR-Bulge label + thresholds from .Params.txt)"
        working-directory: PostProcess
        run: python -m unittest test_report_scorer_label -v

      - name: "Intermediate cleanup guard (default-on rm keeps finalized outputs + web drill-down source; env/cicd guards)"
        working-directory: PostProcess
        run: python -m unittest test_clean_intermediates -v

      - name: "Additional coverage (tier0-compaction / greedy-cap / tiebreak / job-name / search-lists / registry-emit / assembly-reconcile / history-page assembly jobs)"
        # test_annotation: the retry / flock-fallback / BGZF-EOF-guard logic is mock-based
        # (no bgzip/tabix binaries needed) and pysam IS installed above, so it runs here;
        # the heavier real annotation path stays covered by validate-benchmarks.
        working-directory: PostProcess
        run: >
          python -m unittest test_assembly_reconcile test_personal_assembly
          test_ensure_search_lists test_hvdr_greedy_cap test_registry_only_emit
          test_representative_tiebreak test_sanitize_job_name test_tier0_compaction
          test_history_page_assembly test_app_settings test_annotation -v

      - name: "Modular scorer env-manager + runner (env lifecycle/state + subprocess protocol; no TF)"
        # scorer_env: detect env manager, create-command shape, atomic state file,
        # health-check probe. scorer_runner: real stdin/stdout worker protocol against
        # a stdlib fake worker + graceful-degradation paths. Neither needs TensorFlow.
        working-directory: PostProcess
        run: python -m unittest test_scorer_env test_scorer_runner -v

      - name: "CFD clean-room bit-identity (golden fixture) + cosmic-license + info-af registry + synth-sites + change-headers + dash-output-props + complete-test wiring"
        # These stdlib-only suites previously ran in NO CI job. test_cfd_cleanroom_equiv is
        # the clean-room gate: it asserts the production scorer (cfd_score.cfd via
        # cfd_score_bulge_aware) reproduces the frozen historical CFD bit-for-bit from the
        # committed golden fixture (cfd_golden.tsv.gz) across mismatch/bulge/PAM-proximal/
        # IUPAC/gap-key cases -- so the single clean-room scorer can't silently drift from
        # what every released result used. All use only stdlib + the deps installed above
        # (numpy/pandas/matplotlib/pysam); none need dash/flask/TensorFlow.
        working-directory: PostProcess
        run: >
          python -m unittest test_cfd_cleanroom_equiv test_cosmic_license
          test_configure_tmpdir
          test_registry_from_info_af test_synth_sites_gt test_change_headers_bestmerge
          test_dash_output_props test_complete_test -v

      - name: "targets-scoring (score-a-list: CasOFFinder/TSV parsers, CFD slicing, CRISPR-Bulge null rules, carrier overlay vs synthetic registry)"
        # The score-a-list backend (crisprme.py targets-scoring). Hermetic: the
        # CasOFFinder + generic-TSV parsers, CFD-per-site slicing (vs calc_cfd direct,
        # incl. the DNA-bulge front-trim), the CRISPR-Bulge null rules with a STUBBED
        # scorer_runner (no cbulge/TF env needed), and the variant carrier overlay against
        # an in-memory registry built with compile_registry (reuses tier0_registry only).
        working-directory: PostProcess
        run: python -m unittest test_targets_scoring -v

      - name: "CFD clean-room scorer + position-aware bulge penalty (mismatch/PAM/gap/IUPAC/T->U + DNA/RNA/terminal/PAM-proximal bulge)"
        working-directory: PostProcess
        run: python -m unittest test_cfd_score test_bulge_cfd_penalty -v

      - name: "CFD score tables validation (JSON structure/counts/anchors; the committed tables are the source of truth)"
        run: python scripts/generate_cfd_tables.py --check

      - name: "Indel report integrity (header injection) + complete-search flag gate + index resolution"
        # The header-injection guards: a dropped CRISPRitz header made
        # post_analisi_indel.sh prepend the merged file's first DATA row to every
        # per-chromosome subset, so one search row was reported on ~23 chromosomes,
        # each with that chromosome's real rsID/AF/carriers. Plus the unknown-flag
        # rejector (a mistyped --prune-pams used to run genome-wide with pruning
        # silently off), and the index resolver, whose choice must not depend on
        # LC_COLLATE now that a second PAM-less flank width exists. Plus the
        # indexes/SHA256SUMS writer (hermetic; it must never emit an empty file), and
        # a chromosome with SNPs but no indels, which CRISPRitz 2.9.1's refusal of an
        # index dir without a .bin turned into a whole-run abort. Plus legacy-index
        # access: dedicated-PAM and NNN_3 indexes are still listed and downloaded from
        # the default repo only, and the catalog offers each name's fetchable copy.
        working-directory: PostProcess
        run: >
          python -m unittest test_indel_header_injection test_complete_search_flags
          test_index_resolution test_index_repo_routing test_legacy_index_access
          test_iupac_collapse_consistency test_hf_sha256sums
          test_indel_empty_chromosome -v

      - name: "build-index-only leaves no partial index or enriched genome, and stops at a search's build lock"
        # A later run takes an index directory or an enriched genome that is there for
        # a finished one. build-index-only builds each index in a hidden directory and
        # renames it into place once the engine has succeeded, and moves the enriched
        # genome into place last, so a run that ends early (Ctrl-C, an OOM kill, a
        # container stop, an engine error) leaves none. While a search holds the build
        # lock of an output it would use or build, it stops with an ERROR. The real
        # crisprme.py and pool_index_indels.py run against a stub engine on PATH, and a
        # successful build must leave the tree the code before the fix left.
        working-directory: PostProcess
        run: python -m unittest test_build_index_only_atomic -v

      - name: "Compute-backend selection (cpu|cuda|metal resolve/fallback matrix; no TF/cupy)"
        # resolve_backend degradation (requested accelerator absent -> CPU), pre-import
        # env, array_module (numpy vs cupy), and configure_tf device placement via a fake
        # tf. The tensorflow-metal GRU miscompute + numerical self-test fallback is
        # validated at runtime in crispr_bulge_score (needs the model, not in CI).
        working-directory: PostProcess
        run: python -m unittest test_compute_backend -v

      - name: "2.5.1 fast mode + mega + scoring (two-pass equivalence/CFD oracle, aggregate carrier-NA, mega registry/indel-AF)"
        # The two-pass population-level analysis (default since 2.5.3; opt-in `--fast` in
        # 2.5.1, renamed to the `--per-sample` opt-out in 2.5.4): lossless detection +
        # worst-case bound. Plus the all-source mega registry/indel-AF and aggregate
        # carrier/hom "NA".
        working-directory: PostProcess
        run: >
          python -m unittest test_twopass_emit test_twopass_find test_twopass_score
          test_twopass_cfd_exact test_twopass_fast_equivalence test_twopass_legacy_cfd
          test_twopass_lynchpin_counterexamples test_aggregate_carrier_na
          test_build_mega_registry test_build_mega_indel_af test_lossless_dense
          test_memory_check -v
