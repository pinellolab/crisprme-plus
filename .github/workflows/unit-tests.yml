name: unit tests

# Fast, hermetic Python checks that run on every PR touching the code: byte-
# compile the whole pipeline (syntax) and run the network-free unit tests for
# the HuggingFace download/publish + reference-index layer. No Docker build and
# no genome download, so this gives quick signal independent of the heavier
# validate-benchmarks (chr22) and Docker workflows.
#
# Only `requests` is installed (utils.py imports it at module load). We do NOT
# install huggingface_hub: the fallback-contract test then exercises the
# "huggingface_hub absent -> ImportError -> caller falls back" path with no
# network access, keeping CI deterministic.

on:
  pull_request:
    paths:
      - "crisprme.py"
      - "PostProcess/**"
      # This job's tests read these too, so a PR touching only them must still run it:
      # pages/ (test_sanitize_job_name, test_bulge_cap and test_samplesid_emit read main_page.py,
      # test_dash_output_props the folder, via AST-extraction, no Dash needed), scripts/
      # (test_hf_sha256sums, generate_cfd_tables.py --check, test_check_alt_pam's release
      # gate), PAMs/ (test_index_resolution),
      # test/benchmark/ (test_validate_test, test_complete_test, test_ci_workflows), and the
      # docs that test_complete_search_flags, test_install_from_source, test_hf_sha256sums,
      # test_ci_workflows and test_markdown_wrap scan, the last with the changelog fragments of
      # a release in the making (changelog/*.md, merged into CHANGELOG.md at its release),
      # which test_changelog_fragments reads too.
      - "pages/**"
      - "scripts/**"
      - "PAMs/**"
      - "test/benchmark/**"
      - "docs/**"
      - "README.md"
      - "METHODS.md"
      - "CHANGELOG.md"
      - "changelog/**"
      # app.py sizes the search pool from app_settings at import time and index.py
      # imports it; test_app_settings guards that, so a PR touching only these two
      # must still run it.
      - "app.py"
      - "index.py"
      # test_install_from_source runs the installer and checks that what it leaves in
      # the checkout is ignored, so a PR touching only these two must still run it.
      - "install_from_source.sh"
      - ".gitignore"
      # test_documented_sizes reads the one-line installers' README there too, and
      # test_install_from_source compares the Dockerfile's CRISPRitz pin with the script's
      # and its header comment with crisprme.py's version. It also reads the release skill
      # (.claude/skills/release-crisprme/SKILL.md) and runs, as it runs RELEASING.md's, the
      # skill's command that bumps that comment.
      - "install/**"
      - "Dockerfile"
      - ".claude/**"
      # test_ci_workflows reads all of them
      - ".github/workflows/**"
      # generate_report.py, which the report tests run, puts assets/'s logo and background
      # into each report, and falls back to test/data/samplesIDs/ for the sample lists.
      - "assets/**"
      - "test/data/**"
      # the index set of 2.10.0 (the rebuild manifest), which crisprme_hf reads (the index
      # of 2.10.0 that replaces an archive of 2.8.1) and test_index_set checks; the panel
      # recipes it calls (seq_script/merge_panels/*.sh, test_panel_recipes) are under **.sh
      - "seq_script/rebuild/**"
      # test_complete_search_flags reads every .py, .sh, .yml and .yaml file in the
      # repository, seq_script/ and the paper's scripts too, for a complete-search command
      # with a flag complete-search rejects.
      - "**.py"
      - "**.sh"
      - "**.yml"
      - "**.yaml"
  push:
    branches: [ "main", "python3.11", "2.2.0-dev" ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # The hosted job took 523 s at 2.8.1's first release head, and the steps have grown since.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light deps
        # requests: utils.py imports it at module load. numpy: test_phased_haplotype
        # exercises the real iupac_decomposition, which uses np.array (the only
        # scientific-stack dep on that hot path; pandas/CRISPR-Bulge scoring are stubbed in
        # the test since that path uses neither). pandas: test_reference_row_downstream
        # runs the REAL remove_n_and_dots.py (pandas) to reproduce the NaN round-trip
        # that crashed resultIntegrator. pandas + matplotlib: the shareable-report
        # generator (generate_report.py) uses both, and test_generate_report self-skips
        # without them. Still no huggingface_hub, so the fallback-contract test keeps
        # exercising the absent-hf_hub path offline.
        # pyliftover: the assembly-reconcile lift tests (run_liftover + the
        # constructed-truth lift suite) exercise the real pyliftover path; without it
        # they self-skip, leaving the coordinate-lift behaviour unguarded in CI.
        run: python -m pip install --upgrade pip requests numpy pandas matplotlib pysam pyliftover

      - name: Install zsh (each command CRISPRme prints, and the blocks of the docs, are pasted into bash and into zsh)
        # zsh, the default shell of macOS, reads a pasted '#' as a word, not a comment, and
        # stops a command at a pattern that matches nothing: test_indel_window,
        # test_mega_rebuild, test_build_index_only_atomic and test_indel_empty_chromosome paste
        # the removals CRISPRme prints and docs/TROUBLESHOOTING.md's blocks into an interactive
        # bash and an interactive zsh (wave 1c-b of 2.10.0), and skip the zsh half without it.
        run: command -v zsh || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }

      - name: Byte-compile the pipeline (syntax check)
        # pages/history_page.py + pages/settings_page.py: syntax-only (py_compile
        # doesn't execute imports), included here since test_history_page_assembly.py
        # and test_settings_progress.py below exercise them via AST-extraction rather
        # than a normal import (they need a live Dash `app`, which this light CI
        # doesn't set up).
        run: python -m py_compile crisprme.py PostProcess/*.py pages/history_page.py pages/settings_page.py app.py

      - name: HuggingFace download/publish + index unit tests (network-free)
        working-directory: PostProcess
        run: python -m unittest test_crisprme_hf -v

      - name: "Web Settings download progress + failure relay (2.8.1; AST-extracted, no Dash)"
        # with the names Settings refuses, which CRISPRme takes into shell commands; a job runs
        # its argv without a shell, in a folder of its own, and Retry re-runs the command the
        # server launched it with, never a cmd.json of the job's folder (2.10.0)
        working-directory: PostProcess
        run: python -m unittest test_settings_progress -v

      - name: "Text a web request sends runs no command (the genomic-sequence input's extraction here; the pages in web-e2e's image)"
        # The web app took text a request sends into shell commands: the genomic-sequence
        # input's header and sequence name, the search launch's arguments, Remove result's
        # job id, the values of a results link or table (and those into the tables' database
        # queries); and a personal-assembly search's guides, PAM and files into the search's.
        # The checks of seq_script/extract_seq.py run here; its read of a sequence needs
        # bedtools, and the pages' checks Dash, so web-e2e's in-image step runs the module
        # whole, and fails on a skip.
        working-directory: PostProcess
        run: python -m unittest test_web_shell_safety -v

      - name: "No link another user put in the data folder is followed (safe_files; the pages' cases in web-e2e's image)"
        # The web app followed a link a member of the data folder's group put in Results/,
        # Settings/ and the job folders in them: it showed and served any file of the user's
        # to anyone who could reach it, and wrote through one (2.10.0, the review of lane S,
        # round 5, S-R5-2). How safe_files reads, writes and serves a file runs here; the
        # pages' cases, through the real Dash server, run in web-e2e's in-image step
        # (test_web_no_links), and the Settings page's here too (test_settings_progress).
        working-directory: PostProcess
        run: python -m unittest test_safe_files -v

      - name: HF fallback contract (hf_fetch must raise so callers fall back)
        working-directory: PostProcess
        run: python -m unittest test_hf_downloads.TestHfFetchFallbackContract -v

      - name: "Legacy setup: a file the data repo does not host is said in one line on stdout, not as a HuggingFace failure"
        # `crisprme.py setup` printed the Hub's 404 for every VCF, samplesIDs.HGDP.txt and the
        # FASTA of any chromosome but chr22 as a failure, then downloaded each from its source.
        working-directory: PostProcess
        run: python -m unittest test_setup_legacy_database -v

      - name: Variant-index bundle round-trip (dicts travel with the index)
        working-directory: PostProcess
        run: python -m unittest test_index_bundle -v

      - name: Dictless publish/download tiers (registry + genotype companion)
        working-directory: PostProcess
        run: python -m unittest test_dictless_publish -v

      - name: Dictless download OOTB fixes (canonical install name + combined samplesID)
        working-directory: PostProcess
        run: python -m unittest test_dictless_download -v

      - name: "samplesID self-completeness (build emits combined + publish bundles + download installs)"
        working-directory: PostProcess
        run: python -m unittest test_samplesid_emit -v

      - name: Gzipped variant dicts (publish/download route .gz dicts)
        working-directory: PostProcess
        run: python -m unittest test_dict_gzip -v

      - name: Pre-flight input validator (batteries case + guide/PAM padding)
        working-directory: PostProcess
        run: python -m unittest test_validate_inputs -v

      - name: Genome layout (one FASTA per sequence; multi-sequence genomes split or refused)
        working-directory: PostProcess
        run: python -m unittest test_genome_layout -v

      - name: "samplesID over-listing guard (#46: phantom samples inflate AN / deflate AF)"
        working-directory: PostProcess
        run: python test_samplesid_overlisting.py

      - name: post_process.sh writes temps to output dir, not install dir
        # Imports only here: its tests skip with no BEDOPS. web-e2e.yml runs them in the image.
        working-directory: PostProcess
        run: python -m unittest test_post_process_tempdir -v

      - name: Tier-0 registry (dictless redesign — aggregator + mmap round-trip)
        working-directory: PostProcess
        run: python -m unittest test_tier0_registry -v

      - name: Tier-0 compile adapter (dict -> registry, full-panel AN)
        working-directory: PostProcess
        run: python -m unittest test_tier0_compile -v

      - name: Tier-0 wiring into new_simple_analysis (legacy path unchanged + selection matrix)
        working-directory: PostProcess
        run: python -m unittest test_new_simple_analysis_registry -v

      - name: Tier-1 genotype store (per-sample carrier reconstruction round-trip)
        working-directory: PostProcess
        run: python -m unittest test_tier1_genotypes -v

      - name: Tier-1 wiring (genotype tier -> Samples; standalone dictless path)
        working-directory: PostProcess
        run: python -m unittest test_tier1_wiring -v

      - name: Population summary (combination-aware per-db/subpop/global AF)
        working-directory: PostProcess
        run: python -m unittest test_population_summary -v

      - name: Population summary companion wiring (additive off-target output)
        working-directory: PostProcess
        run: python -m unittest test_popsummary_wiring -v

      - name: Dictless tier build emission (build emits tiers where search reads them)
        working-directory: PostProcess
        run: python -m unittest test_build_emit_tiers -v

      - name: "The merge lists and counts each reference alignment once (the dict-less tiers give it again; each variant dataset gives it)"
        working-directory: PostProcess
        run: python -m unittest test_reference_rows_once -v

      - name: "A sites-only dataset's rows stay at their sites in the merge step (the sorts read tab-separated columns; no empty item in a merged list)"
        working-directory: PostProcess
        run: python -m unittest test_merge_sites_only_rows -v

      - name: "Indel per-chrom subset regression (#172: fakechrom match)"
        working-directory: PostProcess
        run: python -m unittest test_indel_chrom_subset -v

      - name: "Indel-path PAM creation (#94: writes PAM_gen index 10, not Var_uniq 11; the reference PAM is read through the indel)"
        # Up to 2.8.0 the reference bases under an indel row's PAM were the REF alignment's,
        # read from the row's start: on the + strand with a 3' PAM (the - strand with a 5'
        # one) a deletion or an insertion in the protospacer moved them len(REF) - len(ALT)
        # bases, and a PAM the reference already has was flagged as created (the WALK
        # panel's chr2:10000 and chr3:20000 rows, pinned here). Since 2.10.0 a PAM holding
        # bases an insertion adds, or a deletion's junction, is judged wherever in its
        # repeat the VCF writes the indel (indel_snp_cis.pam_reference_place: the reference
        # bases it sits on in a placement that leaves it on the reference, else the
        # reference PAM beside the protospacer's base that touches the PAM, else created),
        # a complex record read as its replaced bases (the REF bases they replace) and its
        # added or lost bases (an insertion's or a deletion's), and never created when the
        # REF alignment is the ALT; the rule's own tests, against every placement built
        # whole, are in test_indel_snp_cis.
        working-directory: PostProcess
        run: python -m unittest test_indel_pam_creation -v

      - name: "Indel+SNP co-occurrence (overlay, phased indel GT, cis join, brute-force oracle vs real chr22 fixture)"
        # feature/indel-snp: SNP+indel co-occurring off-target discovery. Pure stdlib
        # tests (no extra deps) + a ~16KB real-data fixture whose brute-force ORACLE
        # independently reconstructs+aligns to cross-validate every coordinate hop
        # (overlay, bulge+strand window map, co-occurrence decode, cis join). Each file
        # is a function-based suite with a __main__ runner that raises on failure.
        working-directory: PostProcess
        run: |
          python test_indel_snp_overlay.py
          python -m unittest test_indel_window -v
          python test_indel_genotypes.py
          python test_indel_snp_cis.py
          python test_indel_snp_bruteforce.py

      - name: "Indel+SNP per-haplotype resolution (2.8.1: each carrier's own SNP alleles, never another sample's; the PAM over every IUPAC code; a second indel read on the carrier's bases; the real analisi_indels_NNN.py on a phased fixture) + the ALT-PAM release gate"
        # Up to 2.8.0 the indel post-analysis read each IUPAC code of the SNP-overlaid
        # fake-indel genome column by column, without genotypes: one sample's indel
        # was reported with SNP alleles only other samples carry, and an R at NRG's
        # last PAM base was shown as A. test_indel_haplotype_resolution pins the
        # resolver (indel_snp_cis.resolve_target) over every IUPAC code at every PAM
        # position and on table-driven phased cases, and that a second indel inside the
        # target takes a carrier off only when it changes the target's bases (real chr22
        # shapes and the review's synthetic ones: a repeat unit gained or lost at the
        # target's edge leaves them, a stretch another variant lengthened does not hold
        # them through the indel, and two second indels whose REFs share a base leave
        # the slot unread, in either order); test_indel_overlaid_rows runs
        # the shipped analyzer on a fixture with the repo's own Tier-0 / Tier-1 /
        # indel-store writers (pandas + numpy; intervaltree is stubbed when absent);
        # test_check_alt_pam covers scripts/check_alt_pam.py (and its check that no
        # reported target holds an N), which validate-benchmarks runs on the chr22
        # outputs.
        working-directory: PostProcess
        run: python -m unittest test_indel_haplotype_resolution test_indel_overlaid_rows test_check_alt_pam -v

      - name: "Indel row coordinates (2.8.1: an RNA-bulge row starts at its first aligned base, the REF text keeps the target's gaps; 2.10.0: a row whose first base is one an insertion adds starts at the insertion's anchor, and a PAM holding inserted bases or a deletion's junction is judged wherever in its repeat the VCF writes the indel; both strands, PAM at either end)"
        # Up to 2.8.0 analisi_indels_NNN.py took CRISPRitz's Cluster_Position for an
        # RNA-bulge row on the + strand with a 3' PAM and on the - strand with a 5' PAM,
        # one base before the first aligned base, and the REF text of an RNA,DNA row, and
        # of a 5' PAM RNA-bulge row, was a base off. Up to 2.8.1 a row whose first base is
        # one an insertion adds started at that base's place on the haplotype, and a PAM
        # holding inserted bases was judged on the REF text read from the row's start; an
        # unreleased draft of 2.10.0's rules took a PAM made of inserted bases for created on
        # every row, also on one starting on a reference base whose REF text is its ALT (a
        # tandem duplication of the PAM's bases), and the next judged it where the VCF
        # writes the insertion (a repeat unit inserted beside a reference PAM: created; on
        # the - strand with a 3' PAM, a row starting on a reference base read its REF
        # text's window, not the reference PAM beside the protospacer, also across a
        # deletion's junction). The shipped analyzer on planted alignments given as the
        # engine reports them (pandas + numpy).
        working-directory: PostProcess
        run: python -m unittest test_indel_row_coordinates -v

      - name: "Indel row Variant_info_spacer+PAM (2.10.0: each variant counted along the target on the haplotype carrying the indel, as a SNP row counts it on the reference)"
        # Up to 2.8.1 resultIntegrator counted an indel row's variants along the reference: a
        # SNP past an insertion was len(ALT) - len(REF) bases short (long on the - strand), also
        # on a row starting on a base an insertion adds, which 2.8.1 placed at that base's
        # place on the haplotype (a SNP before that place got the first number, on the - strand
        # the last), and one past a deletion as many long (short). Counted along the reference
        # from the insertion's anchor, where 2.10.0 places such a row, it would be short (long)
        # by the inserted bases the target holds, less one. The REAL integrator on bestMerge
        # rows of both strands (GNU cut).
        working-directory: PostProcess
        run: python -m unittest test_indel_variant_positions -v

      - name: "Independent real-data indel check (scripts/check_indel_rows.py: its own VCF reader, haplotype builder and aligner; mutation tests that corrupt a right row)"
        # scripts/check_indel_rows.py is the second opinion on the indel path that
        # validate-test cannot give: validate-test compares only the engine's SITES
        # (chromosome, start, strand) on the reference and the SNV-only 1000 Genomes
        # chr22 genome, so an indel row's coordinate, aligned strings, REF text,
        # variants, carriers and the alternative-alignment table are never checked
        # against an independent truth on real data. These tests build a reference, a
        # phased VCF (plain gzip, and BGZF with a tabix index written by the test) and
        # rows by hand, assert a right row raises nothing gating, and assert that each
        # corruption of it is caught: the start shifted by 1 and by an insertion's offset
        # (the 2.8.1 defect), one target base changed, the aligned spacer rewritten, a
        # carrier swapped, added or dropped (also when the same target sits elsewhere),
        # a named variant dropped, a cross-haplotype SNP, a phantom of the shape reported
        # at chr22:22322768 on 2.8.0, an MNV row and an unphased row with a phantom
        # base, a merge that keeps the worse of two alignments of one site or of one
        # target (fewest block, CFD block, a CFD only three decimals tell apart: three
        # real rows of chr22; one worse only by the merge's next sorting criterion, mm
        # after mm+bulges or the criteria after a CFD tie), a fold across strands, a
        # carrier listed for a sequence its MNV changes, a carrier
        # outside the samples list, an ALT block that lost its variants, a population-
        # level cluster dropped beside another cluster's row, a row placed past an
        # insertion's anchor, two targets inside one insertion folded into one, a long
        # deletion's far junction, a second indel that keeps the target's bases, another
        # guide's row, a carrier whose second insertion pushes the record's bases out of
        # the target, a carrier whose second indel puts an SNV's bases where it carries
        # none, a population-level cluster joined to another only through a target no
        # carrier holds, two genotyped VCFs that share samples (refused), calls of unknown
        # phase on the record's REF span, a SNP named for a carrier whose slot's alleles
        # overlap the record and that holds it on no slot, a slot read without its
        # phasing artefact that lacks the row's target, a carrier off by rule in a fold
        # group, a population-level cluster joined through a slot a complex allele takes
        # off, a haploid SNP call beside a diploid record (the reference stays possible),
        # a capped window's greedy row in a per-sample chain, inputs other than the
        # search's (its datasets, budget, PAM, guides, samples list, mode: refused), a
        # run read in the mode it ran (its .search_mode, not --ci-cd-test, which chooses
        # none: a population-level cluster joined only by a worst-case SNP row; a run that
        # records no mode, or contradictory ones, refused), a listed carrier whose slot
        # has no one sequence and that METHODS' rules take off (a second deletion with a
        # SNV on the base it deletes; both alts of a split site), two overlapping alleles
        # that change no base of the target (the carrier judged: an unnamed SNV, a
        # carrier left off, a dropped row), a carrier whose slot has no reading counted and
        # never demanded, a slot read without its artefact that chains no target needing a
        # second indel record, a completeness check of some of a run's guides naming the
        # others, a PUTATIVE rule offered no choice on the record's own REF span (its
        # anchor) and, in a search that scores no CFD, the reference base then A, C, G, T,
        # a record's chain holding its sites-only dataset's rows whoever reads it first
        # and no coded anchor, a search without bulges read from its --vcf list, a VCF's
        # FILTER read as CRISPRme's stores read it (a genotyped record outside PASS and
        # '.' is no record of the search, and its indels stay on their carriers'
        # haplotypes only where the run read a phased indel store written before 2.10.0,
        # which kept them: a SNP the search skips leaves its carrier listed, an indel it
        # skips takes one off a target and off a SNP row on such a store only; a sites-only
        # one's indels dropped, its SNVs open rows of its SNP rows' chain and none of its
        # fake-indel windows, whose rows must name the dataset's own PASS SNVs), a search
        # that says it read no genotype store (its log_verbose.txt, or a --per-sample
        # search run population-level: refused), a run's release read from its records
        # (2.10.0's .indexes_searched.txt; every allele of a split site from the variant
        # index's Q flag or its enriched genome, so its target is demanded, a '*' line no
        # split site; two listings of one SNV REF>ALT at a position one allele, on a line
        # of several ALTs too, their calls merged by CRISPRitz 2.10.0's documented rule (a
        # phased call beside an unphased one of as many copies stays phased), and on a
        # genome of the last record the earlier line's carriers lost; a slot holding two
        # ALTs of one position read by the PUTATIVE rule, a carrier it lists required; an
        # alt of a line of several ALTs untied as CRISPRme's readers untie it (a '*' among
        # the alts that settle its number, an indel's ALT not); the store's FILTER rule
        # from the log; the INDELS index's format from its .bin, a 27-nt target at its
        # fake-indel window's first base left out by format 1, limit-window-edge, and
        # demanded of format 2, a bulged one read by its site (the guide's length from its
        # PAM, and format 1's pad); a target or site past the window,
        # limit-window-reach; no capped greedy row in a 2.10.0 run's chain; a SNP row over
        # --max-degeneracy a row it may write or not; refused where the records do not
        # tell and it matters), a search with CRISPRME_INDEL_SNP=0 (its log's NOTE:
        # refused), one that read a genotyped dataset's indels with no phased indel store
        # (its log's NOTE: refused), a run of 2.10.0 without its log where the VCF holds
        # indels or MNVs (only the log says either: refused), and the
        # SNP-row report (report-only) reading a SNP row's carriers as METHODS section 4
        # does: a named variant outside the target, the 2.10.0 drop of a carrier whose slot
        # holds an indel that changes the target (read through a repeat at its edge, an
        # unreadable slot dropped), a carrier the merge joins from another alignment of the
        # site, and an unphased individual listed for every subset of its variants.
        # CRISPRme's documented limits (a split
        # multi-allelic site, two indels in one target, a complex allele, a phasing
        # artefact, a repeat unit at the target's edge, a PUTATIVE tie) must come out
        # under their own non-gating class, and the driver must never pass silently (a
        # chromosome no VCF covers, one FASTA of several contigs, a sites-only VCF alone
        # or beside a genotyped one, whose rows list no carrier; a deletion longer than
        # an unindexed read looks back; a tabix read yields each record once).
        # Stdlib only -- the checker imports no CRISPRme module, nor do they.
        working-directory: PostProcess
        run: python -m unittest test_check_indel_rows -v

      - name: "Dict-less bulge cap + defaults + 0-bulge indel routing (v2.3.3)"
        working-directory: PostProcess
        run: python -m unittest test_bulge_cap -v

      - name: "Population-distribution out-of-range total never crashes (v2.3.3)"
        working-directory: PostProcess
        run: python -m unittest test_populations_distribution -v

      - name: Phased multi-SNP haplotype not under-reported (deferred-peel fix)
        working-directory: PostProcess
        run: python -m unittest test_phased_haplotype -v

      - name: "Observed-haplotype enumerator (per-individual, confirmed/putative)"
        working-directory: PostProcess
        run: python -m unittest test_observed_haplotypes -v

      - name: "Observed-haplotype integration (real iupac_decomposition, sentinel tail intact)"
        working-directory: PostProcess
        run: python -m unittest test_observed_haplotype_integration -v

      - name: "Every allele of a position read the same way (2.10.0: a VCF line of several ALTs, two records of one REF>ALT, two ALTs on one haplotype slot, Q, rsID and AF in their variant's place)"
        # CRISPRitz 2.10.0 codes every ALT of a split site and writes Q at a position of four
        # bases. The real new_simple_analysis.py on tiers and dictionaries the repository's
        # compilers build, the real remove_contiguous_samples.py, and every reader of
        # variant codes (pam_filter, the SNP overlay, the indel resolver, crispritz_bins,
        # twopass_find, the cluster sort).
        working-directory: PostProcess
