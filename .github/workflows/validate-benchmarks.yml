name: validate-test benchmarks (chr22)

# Runs the full CRISPRme round-trip on a native Linux runner (no emulation):
# complete-test on chr22 with 1000G, then validate-test, which compares
# CRISPRme's predicted off-targets against the committed brute-force ground-truth
# references for every registered benchmark. Fails if any benchmark's off-target
# set does not match.
#
# The published image installs a *released* CRISPRme from bioconda, so we pull it
# and COPY this branch's code over the installed package to exercise the PR's
# changes (crisprme.py, the whole PostProcess/ pipeline, and the benchmark data).
# We copy (merge) rather than bind-mount the directory so install-generated data
# not in the repo is preserved (e.g. CRISTA_predictors.pkl, unzipped at install).

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "PostProcess/**"
      - "test/benchmark/**"
      - "test/data/**"
      - "crisprme.py"
      - ".github/workflows/validate-benchmarks.yml"
  # Weekly run so the benchmark gate also catches DATA-side drift (e.g. a change to
  # the HuggingFace reference data the complete-test downloads) that the code-path
  # PR filter above cannot see — this is how the sample-ID fast-path regression went
  # unnoticed until a manual run.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validate-benchmarks:
    runs-on: ubuntu-latest
    # The hosted runner runs the LIGHT (bulge-1) benchmarks via CRISPRME_SKIP_HEAVY=1
    # (passed into the container on the complete-test/validate-test steps). The "heavy"
    # single-n cases build a bulge-2 index over the variant-enriched genome, which OOMs a
    # 16GB runner (and is too slow under swap) -- they are validated locally / on a larger
    # runner. 120 min is plenty for the light suite.
    timeout-minutes: 120
    env:
      IMG: pinellolab/crisprme
    steps:
      - uses: actions/checkout@v4

      - name: Pull CRISPRme image
        run: docker pull "$IMG"

      - name: Prepare branch-code overlay
        run: |
          # Mount the whole branch repo read-only at /branch; each container step
          # then COPIES the branch's crisprme.py + PostProcess/ + test/ over the
          # installed package. Copying MERGES (PR files overwrite their installed
          # twins) while preserving install-generated data absent from the repo,
          # e.g. CRISTA_predictors.pkl (unzipped from CRISTA_predictors.zip at
          # install). Bind-mounting PostProcess/ over the dir hid that .pkl and
          # broke CRISTA scoring. The copy also brings in PR-added modules
          # (validate_inputs.py, assembly_reconcile.py) so they import + run.
          echo "BRANCH_MOUNT=-v ${GITHUB_WORKSPACE}:/branch:ro" >> "$GITHUB_ENV"

      - name: Smoke — new subcommands dispatch + HF/index unit tests (full env)
        run: |
          docker run --rm $BRANCH_MOUNT "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            # the new subcommands must be recognized (their --help prints a
            # description then exits 1 by design, so check the OUTPUT, not the
            # exit code). Use `if` blocks, not `grep && {...}`, so a not-found
            # grep does not trip `set -e`.
            for c in build-index-only download publish-index; do
              out="$(crisprme.py "$c" --help 2>&1 || true)"
              if ! echo "$out" | grep -qi "functionality"; then
                echo "FAIL: $c --help"; echo "$out" | tail -3; exit 1
              fi
              if echo "$out" | grep -qi "not an allowed command"; then
                echo "FAIL: $c not dispatched"; exit 1
              fi
            done
            cs="$(crisprme.py complete-search --help 2>&1 || true)"
            if ! echo "$cs" | grep -q -- "--index-path"; then echo "FAIL: --index-path missing"; exit 1; fi
            if ! echo "$cs" | grep -q -- "--max-total-edits"; then echo "FAIL: --max-total-edits missing"; exit 1; fi
            # HF + index unit tests inside the full env
            cd /opt/conda/opt/crisprme/PostProcess
            python -m unittest test_crisprme_hf test_hf_downloads.TestHfFetchFallbackContract
            echo "smoke OK"
          '

      - name: Zero-hit regression — empty result must exit 0, not crash
        run: |
          # A search that finds no off-targets must finish cleanly with an empty
          # result (regression guard for the zero-hit post-analysis cascade fix).
          # Uses a synthetic genome with no GG dinucleotide -> no NGG PAM sites ->
          # guaranteed zero hits, so the test is deterministic and needs no
          # download. `set -e` turns the pre-fix non-zero exit into a CI failure.
          mkdir -p zhwork
          docker run --rm $BRANCH_MOUNT -v "${PWD}/zhwork:/DATA" -w /DATA "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            mkdir -p Genomes/synth PAMs
            python -c "open(\"Genomes/synth/chrS.fa\",\"w\").write(\">chrS\n\"+(\"AC\"*3000)+\"\n\")"
            printf "NNNNNNNNNNNNNNNNNNNNNGG 3\n" > PAMs/20bp-NGG-SpCas9.txt
            printf "GGGGGGGGGGGGGGGGGGGGNNN\n" > guide.txt
            crisprme.py complete-search --genome Genomes/synth --pam PAMs/20bp-NGG-SpCas9.txt \
              --guide guide.txt --mm 0 --bDNA 0 --bRNA 0 --output zh
            if ! grep -qi "No off-targets found" Results/zh/log_verbose.txt; then
              echo "FAIL: empty-result message missing"; exit 1
            fi
            if [ -s Results/zh/log_error.txt ]; then
              echo "FAIL: log_error is non-empty"; cat Results/zh/log_error.txt; exit 1
            fi
            echo "zero-hit regression PASS"
          '

      - name: read-only-container smoke (reference-only search, code dir read-only)
        run: |
          # Regression guard for the read-only-filesystem class: the pipeline used to
          # write into the install/code dir (a placeholder vuoto.txt and a bare-relative
          # dummy.txt), so a reference-only search DIED under Apptainer (read-only image)
          # without --writable-tmpfs. CI normally runs the code on the WRITABLE Docker
          # image layer, so it never caught it. Here we chmod the code dir READ-ONLY
          # (mimicking Apptainer) and run a reference-only search that PRODUCES HITS (so
          # the graphical/summary reference branch — where the bug lived — actually runs).
          # A regression fails with "Read-only file system" / "Genome enrichment failed".
          mkdir -p rowork
          docker run --rm $BRANCH_MOUNT -v "${PWD}/rowork:/DATA" -w /DATA "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            mkdir -p Genomes/synth PAMs
            # genome = guide + NGG PAM repeated -> guaranteed hits (exercises post-analysis)
            python -c "open(\"Genomes/synth/chrS.fa\",\"w\").write(\">chrS\n\"+(\"ACGTACGTACGTACGTACGTAGG\"*200)+\"\n\")"
            printf "NNNNNNNNNNNNNNNNNNNNNGG 3\n" > PAMs/20bp-NGG-SpCas9.txt
            printf "ACGTACGTACGTACGTACGTNNN\n" > guide.txt
            # make the install/code dir READ-ONLY (the class the bug lived in)
            chmod -R a-w /opt/conda/opt/crisprme
            crisprme.py complete-search --genome Genomes/synth --pam PAMs/20bp-NGG-SpCas9.txt \
              --guide guide.txt --mm 1 --bDNA 0 --bRNA 0 --output ro
            if [ -s Results/ro/log_error.txt ]; then
              echo "FAIL: log_error non-empty (read-only regression?)"; cat Results/ro/log_error.txt; exit 1
            fi
            ls Results/ro/*integrated_results.tsv >/dev/null 2>&1 \
              || { echo "FAIL: no integrated_results (read-only regression)"; exit 1; }
            echo "read-only-container smoke PASS"
          '

      - name: complete-test (chr22, 1000G) for all registered benchmarks
        run: |
          mkdir -p work
          n=0
          until docker run --rm $BRANCH_MOUNT -e CRISPRME_SKIP_HEAVY=1 -v "${PWD}/work:/DATA" -w /DATA "$IMG" bash -c '
                  set -e
                  cp /branch/crisprme.py /opt/conda/bin/crisprme.py
                  cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
                  mkdir -p /opt/conda/opt/crisprme/test
                  cp -rf /branch/test/* /opt/conda/opt/crisprme/test/
                  crisprme.py complete-test --chrom chr22 --vcf_dataset 1000G
                '; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "complete-test failed after $n attempts"; exit 1; fi
            echo "complete-test attempt $n failed; cleaning + retrying"
            sudo rm -rf work/Results/crisprme-test-out_* || true
            sleep 15
          done

      - name: validate-test (chr22) — assert all benchmarks match the ground truth
        run: |
          docker run --rm $BRANCH_MOUNT -e CRISPRME_SKIP_HEAVY=1 -v "${PWD}/work:/DATA" -w /DATA "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            mkdir -p /opt/conda/opt/crisprme/test
            cp -rf /branch/test/* /opt/conda/opt/crisprme/test/
            crisprme.py validate-test --chrom chr22
          '

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crisprme-test-out-logs
          path: |
            work/Results/**/log_*.txt
          if-no-files-found: ignore
