name: validate-test benchmarks (chr22)

# Runs the full CRISPRme round-trip on a native Linux runner (no emulation):
# complete-test on chr22 with 1000G, then validate-test, which compares
# CRISPRme's predicted off-targets against the committed brute-force ground-truth
# references for every registered benchmark. Fails if any benchmark's off-target
# set does not match.
#
# The published image installs a *released* CRISPRme from bioconda, so we pull it
# and COPY this branch's code over the installed package to exercise the PR's
# changes (crisprme.py, the whole PostProcess/ pipeline, and the benchmark data).
# We copy (merge) rather than bind-mount the directory so install-generated data
# not in the repo is preserved. The CRISPR-Bulge model is not vendored here: it is
# provided via the cbulge conda env (git-cloned by scorer_env), no pkl/zip.

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "PostProcess/**"
      - "test/benchmark/**"
      - "test/data/**"
      - "test/indel_snp_oracle/**"
      - "scripts/check_alt_pam.py"
      - "scripts/check_indel_rows.py"
      - "crisprme.py"
      - ".github/workflows/validate-benchmarks.yml"
      - "test/index_flex/**"
  # ALSO run on direct pushes to main that touch the pipeline. Releases here fast-forward
  # dev -> main (NOT via PRs), so the pull_request trigger above would MISS them — exactly
  # how the complete-test rewrite silently broke this brute-force gate until the weekly cron
  # caught it. This makes the gate fire on every pipeline change that reaches main.
  push:
    branches: [ "main" ]
    paths:
      - "PostProcess/**"
      - "test/benchmark/**"
      - "test/data/**"
      - "test/indel_snp_oracle/**"
      - "scripts/check_alt_pam.py"
      - "scripts/check_indel_rows.py"
      - "crisprme.py"
      - ".github/workflows/validate-benchmarks.yml"
      - "test/index_flex/**"
  # Weekly run so the benchmark gate also catches DATA-side drift (e.g. a change to
  # the HuggingFace reference data the complete-test downloads) that the code-path
  # PR filter above cannot see — this is how the sample-ID fast-path regression went
  # unnoticed until a manual run.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validate-benchmarks:
    runs-on: ubuntu-latest
    # Every registered benchmark runs here, the "heavy" single-n cases included: they build
    # a bulge-2 index over the variant-enriched genome, which fits a 16 GiB, 4-CPU runner with
    # no swap (measured in a container held to that size, arm64: complete-test 23 to 32 min,
    # 3.64 GB of RAM at peak). 120 min is plenty.
    timeout-minutes: 120
    env:
      IMG: pinellolab/crisprme
    steps:
      - uses: actions/checkout@v4

      - name: Pull CRISPRme image
        run: docker pull "$IMG"

      - name: Prepare branch-code overlay
        run: |
          # Mount the whole branch repo read-only at /branch; each container step
          # then COPIES the branch's crisprme.py + PostProcess/ + test/ over the
          # installed package. Copying MERGES (PR files overwrite their installed
          # twins) while preserving install-generated data absent from the repo.
          # The CRISPR-Bulge model is not vendored in PostProcess/: it is provided
          # via the cbulge conda env (git-cloned by scorer_env), no pkl/zip. The
          # copy also brings in PR-added modules
          # (validate_inputs.py, assembly_reconcile.py) so they import + run.
          echo "BRANCH_MOUNT=-v ${GITHUB_WORKSPACE}:/branch:ro" >> "$GITHUB_ENV"

      - name: Smoke — new subcommands dispatch + HF/index unit tests (full env)
        # CRISPRME_RUN_HF_TESTS=1: the one test of a real Hugging Face download, which no other
        # job can run (the unit-tests job has no huggingface_hub), and this one downloads from
        # Hugging Face anyway.
        run: |
          docker run --rm -e CRISPRME_RUN_HF_TESTS=1 $BRANCH_MOUNT "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            # the new subcommands must be recognized (their --help prints a
            # description then exits 1 by design, so check the OUTPUT, not the
            # exit code). Use `if` blocks, not `grep && {...}`, so a not-found
            # grep does not trip `set -e`.
            for c in build-index-only download publish-index; do
              out="$(crisprme.py "$c" --help 2>&1 || true)"
              if ! echo "$out" | grep -qi "functionality"; then
                echo "FAIL: $c --help"; echo "$out" | tail -3; exit 1
              fi
              if echo "$out" | grep -qi "not an allowed command"; then
                echo "FAIL: $c not dispatched"; exit 1
              fi
            done
            cs="$(crisprme.py complete-search --help 2>&1 || true)"
            if ! echo "$cs" | grep -q -- "--index-path"; then echo "FAIL: --index-path missing"; exit 1; fi
            if ! echo "$cs" | grep -q -- "--max-total-edits"; then echo "FAIL: --max-total-edits missing"; exit 1; fi
            # HF + index unit tests inside the full env
            cd /opt/conda/opt/crisprme/PostProcess
            python -m unittest test_crisprme_hf test_hf_downloads
            echo "smoke OK"
          '

      - name: Zero-hit regression — empty result must exit 0, not crash
        run: |
          # A search that finds no off-targets must finish cleanly with an empty
          # result (regression guard for the zero-hit post-analysis cascade fix).
          # Uses a synthetic genome with no GG dinucleotide -> no NGG PAM sites ->
          # guaranteed zero hits, so the test is deterministic and needs no
          # download. `set -e` turns the pre-fix non-zero exit into a CI failure.
          mkdir -p zhwork
          docker run --rm $BRANCH_MOUNT -v "${PWD}/zhwork:/DATA" -w /DATA "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            mkdir -p Genomes/synth PAMs
            python -c "open(\"Genomes/synth/chrS.fa\",\"w\").write(\">chrS\n\"+(\"AC\"*3000)+\"\n\")"
            printf "NNNNNNNNNNNNNNNNNNNNNGG 3\n" > PAMs/20bp-NGG-SpCas9.txt
            printf "GGGGGGGGGGGGGGGGGGGGNNN\n" > guide.txt
            crisprme.py complete-search --genome Genomes/synth --pam PAMs/20bp-NGG-SpCas9.txt \
              --guide guide.txt --mm 0 --bDNA 0 --bRNA 0 --output zh
            if ! grep -qi "No off-targets found" Results/zh/log_verbose.txt; then
              echo "FAIL: empty-result message missing"; exit 1
            fi
            # A zero-hit job ends before log_error.txt is renamed (and before the report),
            # but check whichever log exists, as the read-only smoke below must.
            err=Results/zh/log_error.txt
            [ -e "$err" ] || err=Results/zh/log_error_no_check.txt
            if [ ! -e "$err" ] || [ -s "$err" ]; then
              echo "FAIL: $err is non-empty or missing"; cat "$err"; exit 1
            fi
            echo "zero-hit regression PASS"
          '

      - name: "Which index serves which search (synthetic phased genome, real CLI and engine)"
        run: |
          # The layouts people have: a download (no VCFs, no enriched genome), a library the
          # run cannot write to, an index for another PAM, budget or guide length, a K=8 one.
          # Each search is compared with one on an index dedicated to it, byte for byte, or
          # must refuse clearly, because the engine answers what it cannot do on stdout with
          # exit 0 (test/index_flex). Up to 2.8.0: a 0-bulge search of a download lost its
          # SNP rows, a read-only library gave a clean empty result, a guide no index fits
          # gave wrong rows, all at exit 0. In the container's own file system, so a folder's
          # permissions hold. About 10 minutes on 2 threads.
          docker run --rm $BRANCH_MOUNT "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            python3 /branch/test/index_flex/check_index_flex.py /tmp/index_flex
          '

      - name: read-only-container smoke (reference-only search, code dir read-only)
        run: |
          # Regression guard for the read-only-filesystem class: the pipeline used to
          # write into the install/code dir (a placeholder vuoto.txt and a bare-relative
          # dummy.txt), so a reference-only search DIED under Apptainer (read-only image)
          # without --writable-tmpfs. CI normally runs the code on the WRITABLE Docker
          # image layer, so it never caught it. Here we chmod the code dir READ-ONLY
          # (mimicking Apptainer) and run a reference-only search that PRODUCES HITS (so
          # the graphical/summary reference branch — where the bug lived — actually runs).
          # A regression fails with "Permission denied" / "Genome enrichment failed".
          # The container runs as root, and root writes through permission bits with
          # CAP_DAC_OVERRIDE: the container drops it, or chmod a-w makes nothing read-only and
          # the step cannot fail (CI-1). Its working folder is the container's own, which root
          # owns: a bind-mounted folder of the runner's user is not root's to write in either.
          docker run --rm --cap-drop DAC_OVERRIDE $BRANCH_MOUNT "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            mkdir -p /tmp/rowork && cd /tmp/rowork
            mkdir -p Genomes/synth PAMs
            # genome = guide + NGG PAM repeated -> guaranteed hits (exercises post-analysis)
            python -c "open(\"Genomes/synth/chrS.fa\",\"w\").write(\">chrS\n\"+(\"ACGTACGTACGTACGTACGTAGG\"*200)+\"\n\")"
            printf "NNNNNNNNNNNNNNNNNNNNNGG 3\n" > PAMs/20bp-NGG-SpCas9.txt
            printf "ACGTACGTACGTACGTACGTNNN\n" > guide.txt
            # make the install/code dir READ-ONLY (the class the bug lived in)
            chmod -R a-w /opt/conda/opt/crisprme
            crisprme.py complete-search --genome Genomes/synth --pam PAMs/20bp-NGG-SpCas9.txt \
              --guide guide.txt --mm 1 --bDNA 0 --bRNA 0 --output ro
            # A job that runs to the end renames log_error.txt to log_error_no_check.txt, so a
            # check of log_error.txt alone passed whatever the job wrote: check whichever exists.
            err=Results/ro/log_error.txt
            [ -e "$err" ] || err=Results/ro/log_error_no_check.txt
            if [ ! -e "$err" ] || [ -s "$err" ]; then
              echo "FAIL: $err non-empty or missing (read-only regression?)"; cat "$err"; exit 1
            fi
            ls Results/ro/*integrated_results.tsv >/dev/null 2>&1 \
              || { echo "FAIL: no integrated_results (read-only regression)"; exit 1; }
            ls Results/ro/*_report.zip >/dev/null 2>&1 \
              || { echo "FAIL: no report zip (Results/ro/report.log:)"; cat Results/ro/report.log; exit 1; }
            echo "read-only-container smoke PASS"
          '

      - name: "SNP+indel per-haplotype oracle (synthetic phased genome + VCF, real CLI, per-sample and population-level)"
        run: |
          # A small reference with SpCas9 sites that need an indel, a SNP or both, in
          # cis, in trans, unphased and as two indels on one haplotype; build-index-only
          # then complete-search both ways, and every indel row (and, since 2.10.0, the
          # carriers of every per-sample SNP-only row) is checked against each
          # carrier's own haplotype built from the VCF (test/indel_snp_oracle): the PAM,
          # the CFD of the row's alignment, its mismatches, that every listed carrier has
          # the sequence, the planted sites' expected rows and the co-occurrence
          # companion. Up to 2.8.0 the post-analysis read the overlay's IUPAC codes
          # column by column without genotypes and failed it (TGA/AGA PAMs, phantom
          # 0-edit targets, chimeras of two samples' variants). Sites X and X2: an
          # insertion holding two targets lists both, at its anchor (the merge compares a
          # site's alignments where they are on the haplotype), and one holding a target
          # twice lists it once. Sites T and T2: an insertion after a reference
          # protospacer that copies the reference's PAM there, or adds one before
          # another: not created. Sites PR, PM, QC, QN, QD, QW, QA (and the Cas12a
          # profile's CB1, CB3): a PAM holding inserted bases, or a deletion's junction, is
          # judged wherever in its repeat the VCF writes the indel (2.10.0; the oracle
          # builds every placement on the haplotype the row's variants make). Then the
          # Cas12a profile (5' PAM TTTV): targets whose first base is one an insertion
          # adds, on both strands. Up to 2.8.1 such rows started past the anchor, their
          # variants were numbered along the reference, and a PAM holding inserted bases
          # was judged on the REF text read from the row's start. A few minutes each.
          mkdir -p orcwork
          docker run --rm $BRANCH_MOUNT -v "${PWD}/orcwork:/W" "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            bash /branch/test/indel_snp_oracle/run_oracle.sh /W/run /branch/test/indel_snp_oracle
            bash /branch/test/indel_snp_oracle/run_oracle.sh /W/run12a /branch/test/indel_snp_oracle cas12a
          '

      - name: complete-test (chr22, 1000G) for all registered benchmarks
        run: |
          mkdir -p work
          n=0
          until docker run --rm $BRANCH_MOUNT -e CRISPRME_ALLOW_ONDEMAND_BUILD=1 -v "${PWD}/work:/DATA" -w /DATA "$IMG" bash -c '
                  set -e
                  cp /branch/crisprme.py /opt/conda/bin/crisprme.py
                  cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
                  mkdir -p /opt/conda/opt/crisprme/test
                  cp -rf /branch/test/* /opt/conda/opt/crisprme/test/
                  crisprme.py complete-test --chrom chr22 --vcf_dataset 1000G
                '; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "complete-test failed after $n attempts"; exit 1; fi
            echo "complete-test attempt $n failed; cleaning + retrying"
            sudo rm -rf work/Results/crisprme-test-out_* || true
            sleep 15
          done

      - name: validate-test (chr22) — assert all benchmarks match the ground truth
        # validate-test exits 0 with a benchmark skipped, and a skipped one checked nothing:
        # complete-test left it no output, say. So the step also asks for 0 skipped.
        run: |
          set -o pipefail
          docker run --rm $BRANCH_MOUNT -e CRISPRME_ALLOW_ONDEMAND_BUILD=1 -v "${PWD}/work:/DATA" -w /DATA "$IMG" bash -c '
            set -e
            cp /branch/crisprme.py /opt/conda/bin/crisprme.py
            cp -rf /branch/PostProcess/* /opt/conda/opt/crisprme/PostProcess/
            mkdir -p /opt/conda/opt/crisprme/test
            cp -rf /branch/test/* /opt/conda/opt/crisprme/test/
            crisprme.py validate-test --chrom chr22
          ' 2>&1 | tee validate-test.log
          if ! grep -q ", 0 failed, 0 skipped\.$" validate-test.log; then
            echo "FAIL: a benchmark did not run"; exit 1
          fi

      - name: "Independent real-data indel check on the chr22 self-test output (scripts/check_indel_rows.py)"
        # validate-test above compares only the engine's SITES (chromosome, start,
        # strand) on the reference and the SNV-only 1000 Genomes chr22 genome, so an
        # indel row's coordinate, aligned strings, REF text, variants, carriers and the
        # alternative-alignment table are never checked against an independent truth
        # (test/benchmark/README.md says so). This step is that check, on the output
        # complete-test just produced: scripts/check_indel_rows.py writes each sample's
        # haplotypes itself from the self-test's 1000 Genomes VCF, keeps its own map
        # from haplotype bases to reference coordinates, and aligns with its own
        # exhaustive DP aligner -- it imports and copies no CRISPRme code and runs on the
        # runner, stdlib only, no image (the CFD tables in PostProcess/ are read as data).
        # Soundness on each benchmark with its own budget (test/benchmark/benchmarks.json),
        # then completeness of cas9_sg1617 on the whole of chr22 (about 3 min on 4
        # processes; the step about 4 min). complete-test's searches run in
        # complete-search's default mode, population-level on the index it builds (their
        # .search_mode; --ci-cd-test chooses no mode, it keeps the intermediate files), and
        # write no alternative alignments (.alt_mode = no-alt-alignments), so completeness
        # is checked per merge cluster here, its SNP rows each alignment's worst case (the
        # cluster's row must have no more edits than each target and at least its CFD); the
        # per-sample
        # completeness gate is the release checklist's step 4c on a real panel, and the
        # SNP+indel oracle above. Non-gating limit lines (documented CRISPRme limits)
        # are printed and uploaded on failure; any gating line fails the step, once every
        # benchmark has been checked (fail=1 records it), so the uploaded findings hold
        # them all.
        run: |
          set -euo pipefail
          ref=work/Genomes/hg38_chr22
          vcf=$(ls work/VCFs/hg38_1000G/*.vcf.gz | head -1)
          [ -d "$ref" ] && [ -n "$vcf" ] || { echo "FAIL: no self-test genome/VCF"; exit 1; }
          fail=0
          # name:PAM:mm:bDNA:bRNA:max-total-edits:guide file, from test/benchmark/benchmarks.json
          for spec in cas9_sg1617:20bp-NGG-SpCas9.txt:4:1:1:6:sg1617_test_guide.txt \
                      cas12a_hbg:TTTV-20bp-Cas12a.txt:4:1:1:6:hbg_cas12a_test_guide.txt \
                      cas9_sg1617_n5:20bp-NGG-SpCas9.txt:6:2:2:5:sg1617_test_guide.txt \
                      cas12a_hbg_n5:TTTV-20bp-Cas12a.txt:6:2:2:5:hbg_cas12a_test_guide.txt \
                      cas9_sg1617_simple:20bp-NGG-SpCas9.txt:6:2:2:3:sg1617_test_guide.txt \
                      cas12a_hbg_simple:TTTV-20bp-Cas12a.txt:6:2:2:3:hbg_cas12a_test_guide.txt; do
            IFS=: read -r name pam mm bd br mt gf <<< "$spec"
            d=work/Results/crisprme-test-out_$name
            ls "$d"/*integrated_results.tsv >/dev/null 2>&1 || {
              echo "[$name] no integrated results table (no row in budget); nothing to check"; continue; }
            echo "=== check_indel_rows $name ($mm/$bd/$br, cap $mt)"
            python3 scripts/check_indel_rows.py --results "$d" --reference "$ref" \
              --vcf "$vcf" --pam "work/PAMs/$pam" --guide "work/$gf" --mm "$mm" --bDNA "$bd" \
              --bRNA "$br" --max-total-edits "$mt" --chrom chr22 --mode soundness \
              --out "check_indel_rows_$name.tsv" || fail=1
          done
          echo "=== check_indel_rows completeness (cas9_sg1617, chr22)"
          python3 scripts/check_indel_rows.py \
            --results work/Results/crisprme-test-out_cas9_sg1617 --reference "$ref" \
            --vcf "$vcf" --pam work/PAMs/20bp-NGG-SpCas9.txt --guide work/sg1617_test_guide.txt \
            --mm 4 --bDNA 1 --bRNA 1 --max-total-edits 6 --chrom chr22 --mode completeness \
            --jobs 4 --out check_indel_rows_completeness.tsv || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: a gating finding (the check_indel_rows_*.tsv findings are uploaded)"
            exit 1
          fi

      - name: Upload the indel-check findings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-indel-rows-findings
          path: check_indel_rows_*.tsv
          if-no-files-found: ignore

      - name: "ALT-PAM and no-N release gate on the chr22 outputs (no ALT row shows a PAM the search did not match, no reported target holds an N)"
        run: |
          # scripts/check_alt_pam.py: every ALT-origin block of every integrated results
          # table must show a PAM that satisfies the searched motif (read from the run's
          # Params.txt), with no IUPAC code left. Blind to a motif that allows the base a
          # misreading produces (NRR's last position): the unit tests cover that. And no
          # REF or ALT target of any block may hold an N, an assembly gap, which matches
          # no guide and no PAM; but an indel row's REF text, the reference at its
          # coordinates, may where the run's genome (work/Genomes/<Genome_ref>) itself
          # holds an N there (2.10.0).
          shopt -s nullglob
          tables=(work/Results/crisprme-test-out_*/*integrated_results.tsv)
          if [ "${#tables[@]}" -eq 0 ]; then echo "FAIL: no integrated results under work/Results"; exit 1; fi
          python3 scripts/check_alt_pam.py "${tables[@]}"

      # also when the job is cancelled: up to three tries of complete-test, each of every
      # benchmark, can reach timeout-minutes, which cancels the job, and its logs were lost
      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: crisprme-test-out-logs
          path: |
            work/Results/**/log_*.txt
            orcwork/run/Results/**/log_*.txt
          if-no-files-found: ignore
