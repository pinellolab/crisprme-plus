name: Docker Multi-Arch Build

# Build the CRISPRme Docker image natively for both linux/amd64 and
# linux/arm64 (Apple Silicon). crispritz is COMPILED FROM C++ SOURCE and crisprme
# is installed from the build context (see Dockerfile), and the CRISPR-Bulge
# scorer's dedicated conda env (cbulge, TensorFlow 2.13) is built at image-build
# time (build_scorer_envs=1) on BOTH arches, backend chosen by scorer_backend=auto
# (Dockerfile default, keyed on TARGETARCH): the amd64 layer gets the conda-forge CUDA
# TensorFlow (tensorflow=2.13=cuda*) so the shipped image is GPU-CAPABLE -- it runs the
# scorer on an NVIDIA GPU under 'docker run --gpus all ...' and falls back to CPU
# transparently when no GPU is present; the arm64 layer gets the CPU TF 2.13.1 PyPI
# aarch64 wheel (CUDA has no ARM build) so Apple Silicon stays CPU. CPU and GPU produce
# numerically identical scores (validated on A100; CPU cross-arch max|Δ|=3.6e-7, zero band
# flips). buildx produces a true multi-arch image; the amd64 layer is larger (cudatoolkit/
# cudnn). Build with --build-arg scorer_backend=cpu for a lean CPU-only image.
#
# On pull_request / workflow_dispatch we only BUILD both arches (push: false)
# to validate that both platforms build successfully. Publishing to Docker Hub
# (pinellolab/crisprme:latest + :<tag>) happens only on version tags, using the
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*.*"

jobs:
  # ---------------------------------------------------------------------------
  # Validation build: build both arches, do NOT push. Runs on PRs & manual runs.
  # ---------------------------------------------------------------------------
  build:
    name: Build multi-arch image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk (amd64 CUDA scorer env is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the runner's own arch first and LOAD it, so the next step can RUN it.
      # A multi-platform build cannot be loaded into the daemon, which is why this is
      # a separate single-arch build; buildx reuses its layers for the matrix below.
      - name: Build linux/amd64 and load it (for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: crisprme:ci-smoke

      # Building the image is not evidence that it RUNS. Up to 2.10.0 nothing here ever
      # started a container, so a change that breaks the image at run time but not at
      # build time would have shipped to :latest on the tag. These two commands are the
      # cheapest check that would have caught one: the version the image reports, and
      # the scorer env, which the image builds and then deletes the package cache
      # underneath (`micromamba clean --all --force-pkgs-dirs`). The env's own
      # compute-self-test runs BEFORE that deletion, so only running the built image
      # tests what users actually get.
      - name: Smoke-test the built image (it must run, not just build)
        run: |
          set -euo pipefail
          want="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crisprme.py)"
          echo "::notice::tree pins crisprme $want"
          got="$(docker run --rm crisprme:ci-smoke crisprme.py --version | tr -d '\r')"
          echo "image reports: $got"
          case "$got" in
            *"$want"*) echo "version OK" ;;
            *) echo "::error::image reports '$got', tree pins '$want'"; exit 1 ;;
          esac
          # The real test: `scorer-env check` runs a COMPUTE self-test (it asserts the
          # scorer returns real, distinct scores) and exits 1 on error. It must pass
          # with no /opt/conda/pkgs present.
          docker run --rm crisprme:ci-smoke crisprme.py scorer-env check
          # Informational only -- a cache left behind costs image size, not correctness,
          # so it reports and never fails the build.
          sz="$(docker run --rm crisprme:ci-smoke sh -c \
                 'du -sh /opt/conda/pkgs 2>/dev/null | cut -f1 || true')"
          echo "::notice::/opt/conda/pkgs in the image: ${sz:-absent}"

      - name: Build linux/amd64 + linux/arm64 (validation, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: crisprme:ci-multiarch

  # ---------------------------------------------------------------------------
  # Publish build: build both arches and push to Docker Hub. Only on tags.
  #
  # Publishes to Docker Hub on version tags only (push: true below). Requires
  # the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN — a NEW repo
  # must add these before the first tag, or the login step fails.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish multi-arch image (tags only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Free up runner disk (amd64 CUDA scorer env is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # Always publish the exact version tag. Only move :latest for FINAL releases
        # (a tag with no '-' suffix). Pre-release tags like v2.6.1-rc1 / v2.6.0-gpu-rc1
        # publish only their own tag, so an RC never clobbers the default :latest.
        run: |
          REF="${{ github.ref_name }}"
          TAGS="pinellolab/crisprme:${REF}"
          case "$REF" in
            *-*) echo "pre-release '$REF': NOT updating :latest" ;;
            *)   TAGS="${TAGS}"$'\n'"pinellolab/crisprme:latest" ;;
          esac
          {
            echo "list<<__EOF__"
            echo "$TAGS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
