name: Docker Multi-Arch Build

# Build the CRISPRme Docker image natively for both linux/amd64 and
# linux/arm64 (Apple Silicon). crispritz is COMPILED FROM C++ SOURCE and crisprme
# is installed from the build context (see Dockerfile), and the CRISPR-Bulge
# scorer's dedicated conda env (cbulge, TensorFlow 2.13.1) is built at image-build
# time (build_scorer_envs=1) on BOTH arches: conda tensorflow-cpu=2.13 on x86-64,
# and the same TF 2.13.1 from the PyPI aarch64 wheel on arm64 (conda-forge ships
# tensorflow-cpu=2.13 only for x86-64) -- scorer_env.py picks the per-arch source
# automatically, and the two produce numerically identical scores (validated:
# max|Δ|=3.6e-7, zero band flips). buildx produces a true multi-arch image; the
# linux/arm64 build exercises the arm64 C++ compile AND the aarch64 scorer env.
#
# On pull_request / workflow_dispatch we only BUILD both arches (push: false)
# to validate that both platforms build successfully. Publishing to Docker Hub
# (pinellolab/crisprme:latest + :<tag>) happens only on version tags, using the
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*.*"

jobs:
  # ---------------------------------------------------------------------------
  # Validation build: build both arches, do NOT push. Runs on PRs & manual runs.
  # ---------------------------------------------------------------------------
  build:
    name: Build multi-arch image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 + linux/arm64 (validation, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: crisprme:ci-multiarch

  # ---------------------------------------------------------------------------
  # Publish build: build both arches and push to Docker Hub. Only on tags.
  #
  # Publishes to Docker Hub on version tags only (push: true below). Requires
  # the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN — a NEW repo
  # must add these before the first tag, or the login step fails.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish multi-arch image (tags only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            pinellolab/crisprme:latest
            pinellolab/crisprme:${{ github.ref_name }}
